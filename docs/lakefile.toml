name = "KVACDocs"
defaultTargets = ["KVACDocs"]

# Verso blueprint pinned to v4.30.0 to match the parent KVAC project's
# lean-toolchain (v4.30.0). This is the first rev whose renderer emits the
# machine-readable `blueprint-manifest.json` with a `graphs` array (the schema
# probe-leanblueprint's Verso adapter consumes); v4.28.0 emitted only the
# flattened `blueprint-preview-manifest.json`.
[[require]]
name = "versoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.30.0"

# The parent project (KVAC) provides the Lean declarations referenced by
# `(lean := "KVAC.Core...")` blocks in the chapter files. Lake resolves this
# via the parent lakefile's `[[lean_lib]] name = "KVAC"`.
[[require]]
name = "KVAC"
path = ".."

[[lean_lib]]
name = "KVACDocs"
