<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>KVAC Findings Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 1280×720 slide scaled to the window, BAIF frame (near-black) around a white panel. Single dark look by choice. */
:root {
  --frame: #121814; --panel: #ffffff; --ink: #1f2937; --muted: #4b5563; --rule: #e5e7eb;
  --green: #15c639; --green-ink: #15803d; --red: #b91c1c; --red-bg: #fef2f2;
  --blue: #1d4ed8; --blue-bg: #eff6ff; --box: #f3f4f6; --box-line: #9ca3af;
  --tip-bg: #0b0f0d; --tip-fg: #f3f4f6; --tip-key: #6ee787;
  --sans: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--sans); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#viewport { position: relative; width: 100%; height: 100%; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; background: var(--frame); display: none; }
.slide.on { display: block; }
.abs { position: absolute; }
.hdr { left: 63px; top: 30px; font-size: 11px; letter-spacing: .06em; color: #d1d5db; }
.links { right: 63px; top: 30px; font-size: 10px; color: var(--green); }
.title { left: 63px; top: 92px; font-size: 32px; font-weight: 700; color: #fff; }
.names { right: 63px; top: 102px; font-size: 17px; font-weight: 700; color: var(--green); }
.hrule { left: 63px; right: 63px; top: 155px; height: 1px; background: #3f4a43; }
.panel { left: 63px; top: 176px; width: 1154px; height: 485px; background: var(--panel); }
.ftr { left: 63px; top: 690px; font-size: 11px; letter-spacing: .04em; color: #d1d5db; }
.pno { right: 63px; top: 690px; font-size: 11px; color: #d1d5db; }
.head { left: 85px; top: 188px; width: 300px; font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--ink); }
.oneliner { right: 83px; top: 194px; width: 640px; text-align: right; font-size: 16px; font-style: italic; color: var(--ink); }
.box { background: var(--box); border: 1px solid var(--box-line); border-radius: 4px; text-align: center; font-size: 12px; line-height: 1.3; padding-top: 6px; box-sizing: border-box; }
.box b { font-size: 14.5px; display: block; margin-bottom: 1px; }
.lbl { font-size: 11.5px; white-space: nowrap; }
.lbl.small { font-size: 10px; color: var(--muted); }
.bar { left: 90px; top: 484px; width: 1047px; height: 32px; background: var(--box); border: 1px solid var(--box-line); border-radius: 2px; box-sizing: border-box; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.stmt { left: 90px; top: 535px; width: 1047px; background: #fafafa; border: 1px solid var(--box-line); border-radius: 4px; box-sizing: border-box; padding: 9px 12px; font-size: 13px; line-height: 1.45; }
.stmt p + p { margin-top: 6px; }
.stmt p { margin: 0; }
.prose { font-size: 15px; line-height: 1.5; color: var(--ink); }
.prose p { margin: 0; }
.prose h3 { font-size: 15.5px; margin: 0 0 4px; font-weight: 700; }
.pt { display: flex; flex-direction: column; gap: 4px; }
table.steps { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.35; }
table.steps th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--box-line); padding: 4px 8px; }
table.steps td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
table.steps td:first-child { font-weight: 700; white-space: nowrap; width: 1%; }
table.steps.compact td { padding: 3px 8px; font-size: 13px; }
table.steps tr.grp td { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; border-bottom: 1.5px solid var(--box-line); padding-top: 9px; }
table.steps tr.ok td:last-child, table.steps tr.ok td:first-child { color: var(--blue); }
table.steps tr.bad td:last-child, table.steps tr.bad td:first-child { color: var(--red); }
table.steps tr.fix td { color: var(--green-ink); }
.refs { font-size: 11.5px; color: var(--muted); }
.ph { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.msg { font-size: 12.5px; white-space: nowrap; }
.col { background: var(--box); border: 1px solid var(--box-line); border-radius: 4px; text-align: center; font-size: 13px; font-weight: 700; padding: 6px 0; box-sizing: border-box; }
.note { font-size: 11.5px; font-style: italic; color: var(--muted); line-height: 1.3; }
.red { color: var(--red); font-weight: 700; }
.grn { color: var(--green-ink); font-weight: 700; }
.strike { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.tag { border-radius: 4px; box-sizing: border-box; font-size: 11.5px; padding: 3px 8px; line-height: 1.3; }
.tag.blue { background: var(--blue-bg); border: 1.5px solid var(--blue); color: var(--blue); }
.tag.redb { background: var(--red-bg); border: 1.5px solid var(--red); color: var(--red); }
.tag.greenb { background: #f0fdf4; border: 1.5px solid var(--green-ink); color: var(--green-ink); }
.tag.gray { background: #fafafa; border: 1.5px solid #d1d5db; color: #9ca3af; }
.tag b { display: block; font-size: 12.5px; }
.region { top: 3px; height: 24px; border: 1.5px solid var(--green-ink); border-radius: 3px; box-sizing: border-box; font-size: 12px; display: flex; align-items: center; justify-content: center; color: var(--green-ink); }
.cap { font-size: 9px; color: var(--muted); top: 9px; }
.link { left: 101px; top: 640px; font-size: 11px; color: var(--blue); }
svg.wires { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; overflow: visible; }
table.parts { border-collapse: collapse; font-size: 15px; }
table.parts th, table.parts td { padding: 6px 12px; border-bottom: 1px solid var(--rule); text-align: left; }
table.parts th { background: var(--frame); color: #fff; font-weight: 700; }
table.parts td:first-child { font-weight: 700; width: 60px; }
table.parts td:last-child, table.parts th:last-child { text-align: right; width: 90px; font-variant-numeric: tabular-nums; }
table.parts tr:nth-child(even) td { background: #e7f8eb; }
table.parts tr.split td { border-bottom: 2px solid var(--green); }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 50%; top: -0.62em; transform: translateX(-50%) scaleX(.9); font-size: .7em; line-height: 1; }
sub { font-size: .72em; }
sup { font-size: .72em; }
/* first occurrence of a variable carries the hover text */
.v.first { text-decoration: underline dotted var(--green-ink); text-decoration-thickness: 1.5px; text-underline-offset: 2px; cursor: help; border-radius: 2px; }
.v.first:hover, .v.first:focus-visible { background: rgba(21, 198, 57, .18); outline: none; }
#tip { position: fixed; z-index: 50; max-width: 380px; background: var(--tip-bg); color: var(--tip-fg); border: 1px solid #2f3a33; border-radius: 6px; padding: 10px 12px; font: 13px/1.45 var(--sans); box-shadow: 0 6px 24px rgba(0,0,0,.45); pointer-events: none; }
#tip .k { color: var(--tip-key); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; display: block; }
#tip p { margin: 0 0 6px; }
#tip p:last-child { margin: 0; }
#nav { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; z-index: 40; opacity: .25; transition: opacity .2s; }
#nav:hover, #nav:focus-within { opacity: 1; }
#nav button { background: #1f2a24; color: #e5e7eb; border: 1px solid #3f4a43; border-radius: 4px; font: 12px var(--sans); padding: 5px 9px; cursor: pointer; }
#nav button:focus-visible { outline: 2px solid var(--green); }
#nav span { color: #9ca3af; font: 12px var(--sans); align-self: center; min-width: 34px; text-align: center; }
@media (prefers-reduced-motion: reduce) { #nav { transition: none; } }
</style>

<div id="viewport"><div id="stage"></div></div>
<div id="tip" hidden></div>
<div id="nav"><button id="prev" type="button" aria-label="Previous slide">←</button><span id="count">1 / 4</span><button id="next" type="button" aria-label="Next slide">→</button><button id="fs" type="button">Full screen</button></div>

<script>
// Glossary: type and reason of each variable, attached to its first occurrence in deck order.
var V = '<span class="vec">', E = '</span>';
var G = {
  A: ['A p.p.t. adversary of Definition 4.4 (p. 30) with input (sk, pp, φ, ' + V + 'm' + E + '), run against the user at issuance.', 'It plays the issuer. Anonymity holds even for an issuer that knows sk and deviates from KVAC.I.Srv.'],
  sk: ['(x₀, x<sub>r</sub>, x₁, …, x<sub>n</sub>), scalars in ℤ<sub>p</sub>, output of μCMZ.K (Figure 9, p. 34).', 'Definition 4.4 gives sk to A, so knowledge of the issuer key gives no advantage.'],
  stA: ['The output state of A, an arbitrary string (Definition 4.4).', 'It carries to D what A saw at issuance.'],
  pp: ['(X₀, X<sub>r</sub>, ' + V + 'X' + E + ') with X₀ = x₀H, X<sub>r</sub> = x<sub>r</sub>G and Xᵢ = xᵢG, elements of 𝔾 (Figure 9).', 'The user commits and proves relative to pp.'],
  m: [V + 'm' + E + ' ∈ $\\mathbb{M}^n$, the n attributes (Definition 4.1, p. 28).'.replace('$\\mathbb{M}^n$', '𝕄<sup>n</sup>'), 'The secret input of the user. D must learn nothing about it beyond what the predicates state.'],
  phi: ['A credential predicate φ ∈ Φ with φ(' + V + 'm' + E + ') = 1 (Definition 4.1).', 'The issuance predicate that π<sub>iu</sub> proves about the committed attributes.'],
  IUsr: ['The user side of the issuance protocol, σ ← KVAC.I.Usr(pp, ' + V + 'm' + E + ', φ) (Definition 4.2, p. 28).', 'The first probability of Definition 4.4 runs the honest user.'],
  SimI: ['An interactive procedure Sim.I(pp, φ) that returns st<sub>Sim</sub> (Definition 4.4).', 'The second probability of Definition 4.4 replaces the user by Sim.I, which does not know ' + V + 'm' + E + '.'],
  C: ['The commitment of the user, an element of 𝔾, written C′ = Σᵢ mᵢXᵢ + sG with s ←$ ℤ<sub>p</sub> in Figure 9.', 'It commits to ' + V + 'm' + E + ', so the issuer does not see the attributes.'],
  piiu: ['A proof of ZKP<sub>cmz.iu</sub> for R<sub>cmz.iu</sub> (equation (9), p. 33), statement (C′, ' + V + 'X' + E + ', φ), witness (' + V + 'm' + E + ', s).', 'The issuer checks that the committed attributes satisfy φ.'],
  UV: ['U′ = uG and V′ = x₀U′ + uC″ in 𝔾, with u ←$ ℤ<sub>p</sub> and C″ = C′ + X<sub>r</sub> (Figure 9).', 'The MAC on the committed attributes, before the user unblinds it.'],
  piis: ['A proof of ZKP<sub>cmz.is</sub> for R<sub>cmz.is</sub> (equation (10), p. 33), statement (X₀, C″, U′, V′), witness (x₀, u).', 'The issuer proves that (U′, V′) uses the key behind X₀. Sim.I extracts x₀ from it (p. 40).'],
  sigma: ['The credential σ = (U, V) ∈ 𝔾², with U = rU′ and V = r(V′ − sU′) (Figure 9).', 'The output of issuance and the input of presentation for the real user.'],
  stSim: ['The simulator state st<sub>Sim</sub> = (x₀, ' + V + 'X' + E + ') (proof of Theorem 5.8, p. 40).', 'Sim.P needs x₀ to compute Z without ' + V + 'm' + E + '.'],
  PUsr: ['The user side of presentation, ρ ← KVAC.P.Usr(pp, ' + V + 'm' + E + ', σ, φ) (Definition 4.2, p. 29).', 'Present₀ answers with it.'],
  phi2: ['A predicate φ′ ∈ Φ that D chooses at each query (Definition 4.4).', 'Present<sub>b</sub> answers only when φ′(' + V + 'm' + E + ') holds.'],
  SimP: ['Sim.P(st<sub>Sim</sub>, φ), which returns a simulated presentation (Definition 4.4).', 'Present₁ answers with it.'],
  pip: ['A proof of ZKP<sub>cmz.p</sub> for R<sub>cmz.p</sub> (equation (11), p. 33), statement (U′, ' + V + 'X' + E + ', ' + V + 'C' + E + ', Z, φ), witness (r′, ' + V + 'r' + E + ', ' + V + 'm' + E + '). The user sends it with U′, C<sub>V</sub> and ' + V + 'C' + E + ' (Figure 9).', 'The user proves possession of a valid credential on attributes that satisfy φ.'],
  Present: ['The presentation oracle of Definition 4.4, with b ∈ {0, 1}.', 'For b = 0 it answers with KVAC.P.Usr, for b = 1 with Sim.P. D must tell the two apart.'],
  D: ['A p.p.t. distinguisher with input st<sub>A</sub> and oracle Present<sub>b</sub>, output b′ (Definition 4.4).', 'Its success measures what presentations reveal about ' + V + 'm' + E + '.'],
  b2: ['A bit, b′ ∈ {0, 1}.', 'Adv<sup>anon</sup> is the difference between the probabilities of b′ = 1 in the real and the simulated game.'],
  H: ['The random oracle of the Fiat–Shamir proof systems. The paper writes H<sub>p</sub> for it (§3, p. 24) and writes H for a group generator in crs (Figure 9, p. 34).', 'The simulators of H1 and H2 program it. The extractor of H3 reads its table.'],
  ZKP: ['A non-interactive proof system with the instances ZKP<sub>cmz.iu</sub>, ZKP<sub>cmz.is</sub> and ZKP<sub>cmz.p</sub>.', 'The only hypothesis of Theorem 5.8.'],
  R: ['A relation R ⊇ R<sub>cmz</sub>.', 'Theorem 5.8 asks ZKP to prove some relation that contains R<sub>cmz</sub>.'],
  Rcmz: ['R<sub>cmz</sub> = R<sub>cmz.iu</sub> ∪ R<sub>cmz.is</sub> ∪ R<sub>cmz.p</sub>, equations (9) to (11) (p. 33, p. 35).', 'The three statements that μCMZ proves.'],
  muCMZ: ['The keyed-verification credential system of Figure 9 (p. 34).', 'The scheme that Theorem 5.8 states anonymous.'],
  n: ['A natural number, n = poly(λ).', 'The number of attributes.'],
  lambda: ['A natural number, the security parameter.', 'Every advantage is a function of λ.'],
  Advanon: ['A function of λ and n, the difference of the two probabilities of Definition 4.4.', 'μCMZ is anonymous when it is negligible in λ.'],
  Advzk: ['The advantage of an adversary in the zero-knowledge game of a proof system.', 'H1 and H2 each replace real proofs by simulated ones, and each adds one such term to the bound.'],
  Advksnd: ['The advantage of an adversary in the knowledge-soundness game of §3.3 (p. 26), where the adversary has the random oracle only.', 'H3 extracts (x₀, u) from π<sub>is</sub> and fails with at most this probability.'],
  A1: ['A p.p.t. adversary in the zero-knowledge game of ZKP<sub>cmz.iu</sub>, built in H1 (p. 41).', 'It distinguishes real from simulated π<sub>iu</sub> whenever H0 and H1 differ noticeably.'],
  D1: ['A p.p.t. adversary in the zero-knowledge game of ZKP<sub>cmz.p</sub>, built in H2 (p. 41).', 'It distinguishes real from simulated π<sub>p</sub>. The H2 inequality prints ZKP<sub>cmz.iu</sub> for its index (p. 41), the theorem prints ZKP<sub>cmz.p</sub>.'],
  A2: ['A p.p.t. adversary in the knowledge-soundness game of ZKP<sub>cmz.is</sub>, built in H3 (p. 41).', 'It runs A internally and returns the π<sub>is</sub> on which extraction fails.'],
  H1: ['A hybrid game of the proof of Theorem 5.8 (p. 41).', 'It generates π<sub>iu</sub> with the zero-knowledge simulator on (C′, ' + V + 'X' + E + ', φ) instead of the witness.'],
  H2: ['A hybrid game of the proof of Theorem 5.8 (p. 41).', 'It generates π<sub>p</sub> with the zero-knowledge simulator on (U′, X₀, ' + V + 'X' + E + ') instead of ' + V + 'm' + E + ' and σ.'],
  phiding: ['A property of a commitment scheme.', 'Commitments to any two messages have the same distribution. Even an unbounded adversary learns nothing about the message.'],
  H3: ['A hybrid game of the proof of Theorem 5.8 (p. 41).', 'It runs the extractor of π<sub>is</sub> on (X₀, U′, V′) and checks the witness (x₀, u).'],
  Pis: ['Region HS, a set of inputs of the random oracle, argument of μCMZ_anonymity (KVAC/Schemes/MicroCMZ/Anonymity.lean, line 394).', 'Hypotheses his and hext confine ZKP<sub>cmz.is</sub> and its extractor to it.'],
  Piu: ['Region HS, a set of inputs of the random oracle, argument of μCMZ_anonymity.', 'Hypotheses hiu and hiuSim confine ZKP<sub>cmz.iu</sub> and its simulator to it.'],
  Pp: ['Region HS, a set of inputs of the random oracle, argument of μCMZ_anonymity.', 'Hypotheses hp and hpSim confine ZKP<sub>cmz.p</sub> and its simulator to it.'],
  Sim: ['The pair Sim = (Sim.I, Sim.P) of Definition 4.4 (p. 30).', 'It plays the user without the attributes. A and D must not tell it from the honest user.'],
  Up: ['U′ = rU ∈ 𝔾 with r ←$ ℤ<sub>p</sub> (Figure 9, p. 34). The paper reuses the name U′ of issuance.', 'It re-randomizes the credential, so presentations of one σ are unlinkable.'],
  CV: ['C<sub>V</sub> = V′ + r′H ∈ 𝔾 with V′ = rV and r′ ←$ ℤ<sub>p</sub> (Figure 9).', 'It commits to V′, so the verifier never sees the MAC value.'],
  Ci: ['Cᵢ = mᵢU′ + rᵢG ∈ 𝔾 with rᵢ ←$ ℤ<sub>p</sub>, one per attribute (Figure 9).', 'It commits to mᵢ. The proof π<sub>p</sub> shows that the committed attributes satisfy φ′.'],
  x0: ['x₀ ∈ ℤ<sub>p</sub>, the component of sk behind X₀ = x₀H (Figure 9).', 'π<sub>is</sub> proves that the MAC uses it. Sim.I extracts it into st<sub>Sim</sub> (p. 40).'],
  thm: ['A Lean theorem, KVAC/Schemes/MicroCMZ/Anonymity.lean, line 388.', 'The formal statement of Theorem 5.8, with the condition of Remark 5.9 as the hypotheses hiu to his_p.']
};

function v(k, html) { return '<span class="v" data-k="' + k + '">' + html + '</span>'; }
var pi = function (s) { return 'π<sub>' + s + '</sub>'; };
var vec = function (s) { return '<span class="vec">' + s + '</span>'; };

function frame(n, inner) {
  return '<section class="slide" id="s' + n + '">' +
    '<div class="abs hdr">BENEFICIAL AI FOUNDATION</div>' +
    '<div class="abs links">LINKS [Linear] [GitHub] [VeriLib]</div>' +
    '<div class="abs title">Findings and lessons from KVAC so far</div>' +
    '<div class="abs names">Christiano · Jin · Semar · Marco · Oana · Callum</div>' +
    '<div class="abs hrule"></div><div class="abs panel"></div>' + inner +
    '<div class="abs ftr">SIGNAL SHOT / KEYED-VERIFICATION ANONYMOUS CREDENTIAL · 2 NOVEMBER 2026</div>' +
    '<div class="abs pno">18</div></section>';
}

function diagram(mode) {
  var fix = mode === 'fix';
  var s = '';
  s += '<svg class="wires" viewBox="0 0 1280 720" aria-hidden="true"><defs>' +
    '<marker id="ar' + mode + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>' +
    '<line x1="456" y1="259" x2="303" y2="259" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar' + mode + ')"/>' +
    '<line x1="301" y1="289" x2="454" y2="289" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar' + mode + ')"/>' +
    '<line x1="571" y1="305" x2="571" y2="368" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar' + mode + ')"/>' +
    '<line x1="705" y1="403" x2="856" y2="403" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar' + mode + ')"/>' +
    '<line x1="379" y1="300" x2="379" y2="484" stroke="' + (fix ? '#15803d' : '#9ca3af') + '" stroke-width="1.4" stroke-dasharray="5 4"/>' +
    '<line x1="782" y1="436" x2="782" y2="484" stroke="' + (fix ? '#15803d' : '#9ca3af') + '" stroke-width="1.4" stroke-dasharray="5 4"/>';
  if (mode === 'proof' || fix) {
    var c1 = fix ? '#d1d5db' : '#1d4ed8', c2 = fix ? '#d1d5db' : '#b91c1c';
    s += '<line x1="470" y1="216" x2="395" y2="246" stroke="' + c1 + '" stroke-width="1.4"/>' +
      '<line x1="275" y1="336" x2="330" y2="300" stroke="' + c2 + '" stroke-width="1.4"/>' +
      '<line x1="800" y1="366" x2="782" y2="384" stroke="' + c2 + '" stroke-width="1.4"/>';
  }
  if (fix) s += '<line x1="346" y1="446" x2="436" y2="494" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/>';
  s += '</svg>';
  s += '<div class="abs box" style="left:90px;top:240px;width:211px;height:65px"><b>' + v('A', 'A') + ', the issuer</b>holds ' + v('sk', 'sk') + ', outputs ' + v('stA', 'st<sub>A</sub>') + '<br>plays the server</div>';
  s += '<div class="abs box" style="left:456px;top:240px;width:230px;height:65px"><b>User at issuance</b>real, ' + v('IUsr', 'KVAC.I.Usr') + '(' + v('pp', 'pp') + ', ' + v('m', 'm') + ', ' + v('phi', 'φ') + ')<br>simulated, ' + v('SimI', 'Sim.I') + '(pp, φ)</div>';

function hide() { tip.hidden = true; }
stage.addEventListener('mouseover', function (e) { var el = e.target.closest('.v.first'); if (el) show(el); });
stage.addEventListener('mouseout', function (e) { if (e.target.closest('.v.first')) hide(); });
stage.addEventListener('focusin', function (e) { var el = e.target.closest('.v.first'); if (el) show(el); });
stage.addEventListener('focusout', hide);

// scaling and navigation
var cur = 0, all = stage.querySelectorAll('.slide');
all.forEach(function (el, i) { el.id = 's' + (i + 1); el.querySelector('.pno').textContent = i + 1; });
function fit() {
  var vp = document.getElementById('viewport');
  var s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720);
  stage.style.transform = 'translate(' + (vp.clientWidth - 1280 * s) / 2 + 'px,' + (vp.clientHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
}
function go(i) {
  cur = Math.max(0, Math.min(all.length - 1, i));
  all.forEach(function (s, j) { s.classList.toggle('on', j === cur); });
  document.getElementById('count').textContent = (cur + 1) + ' / ' + all.length;
  hide();
}
window.addEventListener('resize', fit);
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { go(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(all.length - 1);
});
document.getElementById('viewport').addEventListener('click', function (e) {
  if (e.target.closest('a, .v.first')) return;
  go(cur + 1);
});
document.getElementById('prev').onclick = function () { go(cur - 1); };
document.getElementById('next').onclick = function () { go(cur + 1); };
document.getElementById('fs').onclick = function () {
  var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  if (p && p.catch) p.catch(function () {});
};
var h = /^#s([1-8])$/.exec(location.hash);
fit(); go(h ? +h[1] - 1 : 0);
</script>

</body>
</html>
