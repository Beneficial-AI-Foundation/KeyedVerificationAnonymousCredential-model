name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Verso Documentation
    runs-on: ubuntu-latest
    # Library build + site generation take a few minutes with a warm cache;
    # cap well above that so a stalled `lean` process fails fast instead of
    # burning the 6h GitHub default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # One dependency cache (Mathlib included) shared with docs-ci.yml and
      # lean_action_ci.yml. The two docs workflows build the superset (KVAC,
      # KVACDocs and the Verso family) and are the only writers; lean_action_ci
      # is restore-only, so a KVAC-only build can never claim a key first and
      # freeze an entry without the Verso artifacts (entries are immutable once
      # saved). The key covers OS, architecture, a schema version (bump it to
      # invalidate everything, e.g. after a runner image change), toolchain and
      # manifest, but not the commit: a new ~2.5 GiB entry is written only when
      # dependencies change, and the entry saved on main is what every PR
      # restores. The fallback prefix keeps the toolchain, so a Lean bump never
      # restores artifacts built by another Lean. KVAC's own build (.lake/build)
      # is not cached; it costs about a minute.
      - name: Cache Lake dependencies
        id: lake-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ hashFiles('lean-toolchain') }}-

      # Skipped on an exact hit: the restored tree already holds Mathlib's
      # .oleans, and `cache get` would otherwise re-download every archive (it
      # only looks in ~/.cache/mathlib, not in .lake). On a prefix hit it fetches
      # just the changed files; on a miss, everything. Failures are real (network,
      # or proofwidgets/plausible pins diverging from Mathlib's) and must fail the
      # job rather than fall through to compiling Mathlib from source.
      - name: Download Mathlib cache
        if: steps.lake-cache.outputs.cache-hit != 'true'
        run: lake exe cache get

      # Build only the KVACDocs library (a lean_lib of the root package). No
      # executable is defined for the docs: linking one would pull in VCV-io's
      # post-quantum C/FFI sources, which need git submodules and extra compile
      # flags. The HTML is produced by `lean --run docs/Main.lean` below, which
      # only needs the .olean artifacts.
      - name: Build Verso docs (library only)
        run: lake build KVACDocs

      - name: Generate documentation site
        run: lake env lean --run docs/Main.lean --output site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Progress-over-time persistence: merge the committed seed, the
      # previously deployed history (fetched from the live site; a 404 is
      # bootstrap, any other failure degrades gracefully), and the exact
      # HEAD snapshot computed from the freshly generated manifest.
      - name: Update progress history
        run: |
          python3 scripts/blueprint_progress_history.py update \
            --site site \
            --seed docs/blueprint-progress-seed.json \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/blueprint-progress-history.json" \
            --commit "$GITHUB_SHA"

      - name: Generate landing page
        run: python3 scripts/blueprint_dashboard.py --site site --check-links

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: List final site structure
        run: |
          echo "=== Site structure ==="
          find site -type f | head -50
          echo "..."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
