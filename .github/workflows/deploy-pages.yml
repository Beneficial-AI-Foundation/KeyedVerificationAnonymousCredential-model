name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Verso Documentation
    runs-on: ubuntu-latest
    # Library build + site generation take a few minutes with a warm cache;
    # cap well above that so a stalled `lean` process fails fast instead of
    # burning the 6h GitHub default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            docs/.lake
          key: ${{ runner.os }}-lake-docs-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json', 'docs/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-docs-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json', 'docs/lean-toolchain') }}-
            ${{ runner.os }}-lake-docs-

      - name: Download Mathlib cache (docs)
        continue-on-error: true
        run: lake -d docs exe cache get

      - name: Download Mathlib cache (root)
        continue-on-error: true
        run: lake exe cache get

      # Build only the KVACDocs library. The `docs` executable is no longer
      # defined; linking it would pull in VCV-io's post-quantum C/FFI sources,
      # which need git submodules and extra compile flags. The HTML is produced
      # by `lean --run Main.lean` below, which only needs the .olean artifacts.
      - name: Build Verso docs (library only)
        run: lake -d docs build KVACDocs

      - name: Generate documentation site
        working-directory: docs
        run: lake env lean --run Main.lean --output ../site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Progress-over-time persistence: merge the committed seed, the
      # previously deployed history (fetched from the live site; a 404 is
      # bootstrap, any other failure degrades gracefully), and the exact
      # HEAD snapshot computed from the freshly generated manifest.
      - name: Update progress history
        run: |
          python3 scripts/blueprint_progress_history.py update \
            --site site \
            --seed docs/blueprint-progress-seed.json \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/blueprint-progress-history.json" \
            --commit "$GITHUB_SHA"

      - name: Generate landing page
        run: python3 scripts/blueprint_dashboard.py --site site --check-links

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: List final site structure
        run: |
          echo "=== Site structure ==="
          find site -type f | head -50
          echo "..."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
