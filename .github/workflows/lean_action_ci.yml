name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy build finishes in ~11 min; cap well above that so a stalled
    # `lean` process fails fast instead of burning the 6h GitHub default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
