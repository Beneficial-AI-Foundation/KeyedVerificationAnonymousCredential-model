name: Docs CI

# PR-time verification of the Verso blueprint docs: the site must build, every
# `(lean := ...)` anchor must resolve (strictResolve makes unresolved anchors
# errors), and every public declaration of the root library must be covered by
# exactly one blueprint anchor. Closes the gap where docs breakage could only
# surface in the post-merge Pages deploy.

on:
  pull_request:
    paths:
      - "KVAC/**"
      - "KVAC.lean"
      - "docs/**"
      - "scripts/blueprint_decl_manifest.lean"
      - "scripts/blueprint_coverage_check.py"
      - "scripts/blueprint_dashboard.py"
      - "scripts/blueprint_progress_history.py"
      - "scripts/fixtures/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build docs and check declaration coverage
    runs-on: ubuntu-latest
    # A healthy run finishes in minutes; cap well above that so a stalled
    # `lean` process fails fast instead of burning the 6h GitHub default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            docs/.lake
          key: ${{ runner.os }}-lake-docs-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json', 'docs/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-docs-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json', 'docs/lean-toolchain') }}-
            ${{ runner.os }}-lake-docs-

      - name: Download Mathlib cache (docs)
        continue-on-error: true
        run: lake -d docs exe cache get

      - name: Download Mathlib cache (root)
        continue-on-error: true
        run: lake exe cache get

      - name: Build root library
        run: lake build

      - name: Build Verso docs
        run: lake -d docs build KVACDocs

      - name: Generate documentation site
        working-directory: docs
        run: lake env lean --run Main.lean --output "$RUNNER_TEMP/site"

      - name: Declaration manifest
        run: lake env lean --run scripts/blueprint_decl_manifest.lean > "$RUNNER_TEMP/decl-manifest.tsv"

      - name: Blueprint coverage check
        run: python3 scripts/blueprint_coverage_check.py "$RUNNER_TEMP/decl-manifest.tsv"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Landing-page pipeline smoke tests: the history updater must produce
      # exactly one exact HEAD snapshot on top of the seed, and the dashboard
      # must render with working links and counters that agree with the
      # rendered Blueprint Summary page.
      - name: Progress history (exact HEAD snapshot)
        run: |
          python3 scripts/blueprint_progress_history.py update \
            --site "$RUNNER_TEMP/site" \
            --seed docs/blueprint-progress-seed.json
          python3 - "$RUNNER_TEMP/site/blueprint-progress-history.json" <<'EOF'
          import json, subprocess, sys
          doc = json.load(open(sys.argv[1]))
          exact = [s for s in doc["snapshots"] if not s.get("estimated")]
          assert len(exact) == 1, f"expected exactly one exact snapshot, got {len(exact)}"
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
          assert exact[0]["commit"] == head, f"exact snapshot {exact[0]['commit']} is not HEAD {head}"
          EOF

      - name: Landing page (links + Blueprint Summary conformance)
        run: |
          python3 scripts/blueprint_dashboard.py --site "$RUNNER_TEMP/site" \
            --check-links \
            --conformance "$RUNNER_TEMP/site/html-multi/Blueprint-Summary/index.html"
          test "$(grep -o 'class="chart-card"' "$RUNNER_TEMP/site/index.html" | wc -l)" = "2"
          test "$(grep -o '<tr><th scope="row">' "$RUNNER_TEMP/site/index.html" | wc -l)" = "7"

      - name: Landing page (determinism)
        run: |
          cp "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/index-run1.html"
          python3 scripts/blueprint_dashboard.py --site "$RUNNER_TEMP/site"
          cmp "$RUNNER_TEMP/index-run1.html" "$RUNNER_TEMP/site/index.html"

      - name: Landing page (estimated-history fixture)
        run: |
          python3 scripts/blueprint_dashboard.py --site "$RUNNER_TEMP/site" \
            --history scripts/fixtures/blueprint-progress-history.fixture.json \
            --output "$RUNNER_TEMP/fixture-index.html"
          # Estimated SEGMENTS must render (dashed class), not just the word
          # "estimated" in CSS or the permanent caption.
          grep -q 'class="line specified estimated"' "$RUNNER_TEMP/fixture-index.html"
          grep -q 'class="pt specified estimated"' "$RUNNER_TEMP/fixture-index.html"
