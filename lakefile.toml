name = "KVAC"
version = "0.1.0"
keywords = ["formal verification", "cryptography"]
defaultTargets = ["KVAC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The header linter hardcodes Mathlib's "Apache 2.0" license line; this repo
# is MIT (see LICENSE), so its license check can never pass here.
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Verso blueprint docs are a library of this package (`[[lean_lib]] KVACDocs`
# below) so that Mathlib, VCV-io and the Verso family are resolved and built
# once, in this workspace. Declared BEFORE mathlib on purpose: Lake gives later
# requires precedence for shared transitive pins, and Mathlib's proofwidgets /
# plausible revisions must win or `lake exe cache get` computes wrong hashes.
# `v4.30.0` is upstream's release BRANCH for Lean v4.30 (there are no tags), so
# `lake update` may advance it within that branch. It must track lean-toolchain:
# a Verso built for another Lean version does not compile, so bump the rev,
# the toolchain and Mathlib together and rebuild `KVACDocs` to validate.
[[require]]
name = "versoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.30.0"

# Mathlib pinned to v4.30.0 to match the toolchain and the revision required
# by VCV-io and the PQXDH formalisation. When the Curve25519Dalek dependency
# is added later (alongside the Examples/ track), this pin should match the
# revision Curve25519Dalek transitively uses, to avoid version conflicts.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

# VCV-io provides the `SampleableType` typeclass used by `KVAC/Core/Group.lean`
# and, in later tracks, the `OracleComp` / `OracleSpec` infrastructure for
# game-based security definitions and the hardness-assumption library under
# `VCVio/CryptoFoundations/HardnessAssumptions/`. Pinned to the exact commit of
# the upstream `bump-lean-mathlib-v4.30.0` branch that this port was built and
# tested against; a branch name here would let `lake update` move the pin.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCV-io.git"
rev = "5ed119b1f0fa8b69975ad2b45bd9e7680056f404"

# curve25519-dalek-lean-verify is intentionally NOT a dependency at this stage.
# The 2024 paper formalisation does not require any Ristretto-specific
# functionality; everything is stated over an abstract prime-order group.
# It is added later in Track Ex (#17) alongside KVAC/Examples/ConcreteRun.lean
# and KVAC/Instances/Ristretto.lean in a single PR. See docs/PLAN.md and
# docs/TRACKS.md (Track Ex) for the rationale.

[[lean_lib]]
name = "KVAC"

# Verso chapter files are prose, not Mathlib-style Lean: the Mathlib linter set
# (hashCommand on `#doc`, longLine, docBlame) does not apply to them. The dotted
# key must stay unquoted; a quoted key is passed to Lean as one atomic name.
[[lean_lib]]
name = "KVACDocs"
srcDir = "docs"
leanOptions = { weak.linter.mathlibStandardSet = false }
